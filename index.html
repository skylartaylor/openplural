<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenPlural has moved to Pluralport</title>
  <link rel="canonical" href="https://pluralport.com/">
  <meta http-equiv="refresh" content="0; url=https://pluralport.com/">
  <script>
    (function () {
      var path = window.location.pathname.replace(/^\/openplural(?=\/|$)/, "");
      var destination = new URL(path || "/", "https://pluralport.com/");
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    }());
  </script>
</head>
<body>
  <p>
    OpenPlural is now Pluralport.
    <a href="https://pluralport.com/">Continue to pluralport.com</a>.
  </p>
</body>
</html>
